[workspace]
name = "safe-sgcrl"
version = "0.1.0"
description = "Safe Goal-Conditioned Contrastive RL with Absorbing Failure States"
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64"]

[dependencies]
python = "3.9.*"
pip = ">=22"
numpy = ">=1.22,<1.24"
scipy = ">=1.8,<1.10"
matplotlib = ">=3.5"
absl-py = ">=1.1"
tqdm = ">=4.64"
h5py = ">=3.7"
protobuf = ">=3.19,<4"
grpcio = ">=1.46,<1.50"
cython = ">=0.29"
cuda-toolkit = "12.*"
cudnn = ">=9.0"
jupyterlab = ">=3.6"
ipykernel = ">=6.0"

[pypi-dependencies]
jax = { version = ">=0.4.20,<0.5", extras = ["cuda12"] }
dm-acme = "==0.4.0"
dm-haiku = ">=0.0.6,<0.1"
dm-reverb = ">=0.7.0,<0.13"
dm-launchpad = ">=0.5.0,<0.6"
dm-env = ">=1.5,<2"
dm-tree = ">=0.1.7,<0.2"
dm-sonnet = ">=2.0.0,<3"
optax = ">=0.1.2,<0.2"
chex = ">=0.1.3,<0.2"
distrax = ">=0.1.2,<0.2"
rlax = ">=0.1.2,<0.2"
flax = ">=0.5.0,<0.7"
tensorflow = ">=2.8,<2.13"
tensorflow-probability = ">=0.15,<0.20"
gym = ">=0.19,<0.27"
mujoco = ">=2.2,<3"
cloudpickle = ">=1.6"
tensorboard = ">=2.8"
torch = ">=1.12"
tabulate = ">=0.8"
portpicker = ">=1.5"
psutil = ">=5.9"

[tasks]
train-fourrooms = "python lp_contrastive.py --lp_launch_type=local_mt --env point_FourRooms --num_steps 500000"
train-fourrooms-safety = "python lp_contrastive.py --lp_launch_type=local_mt --env point_FourRooms --num_steps 500000 --region_bounds=0,5:5,11"
jupyter = "jupyter lab --no-browser --port 8888"

# ── Separate environment for tabular JAX notebooks (Blackwell GPU support) ──
# Uses no-default-feature = true so it does NOT inherit the base [dependencies]
# (which pin Python 3.9 and the dm-acme stack).
[feature.tabular-jax.dependencies]
python = "3.11.*"
pip = ">=22"
numpy = ">=1.24"
scipy = ">=1.12"
matplotlib = ">=3.8"
tqdm = ">=4.64"
jupyterlab = ">=4.0"
ipykernel = ">=6.0"
cuda-toolkit = "12.8.*"
cudnn = ">=9.0"

[feature.tabular-jax.pypi-dependencies]
jax = { version = ">=0.5.0", extras = ["cuda12"] }

[feature.tabular-jax.tasks]
jupyter = "jupyter lab --no-browser --port 8888"

[environments]
default = { features = [], solve-group = "default" }
tabular-jax = { features = ["tabular-jax"], no-default-feature = true }
